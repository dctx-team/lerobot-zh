site_name: LeRobot Documentation
site_url: https://dctx-team.github.io/lerobot-zh/en/
docs_dir: docs/_md/en
site_dir: docs/_build/en
theme:
  name: material
  language: en
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - search.highlight
  palette:
    scheme: default
    primary: indigo
markdown_extensions:
- admonition
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
